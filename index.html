<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Visualization Dashboard</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body {
            display: flex;
            flex-direction: column;
            height: 100vh;
            background-color: #f4f4f4;
            font-family: Arial, sans-serif;
        }
        #button-container {
            position: absolute;
            top: 10px;
            right: 10px;
            display: flex;
            gap: 5px;
        }
        button {
            padding: 5px 10px;
            font-size: 14px;
            cursor: pointer;
            border: none;
            border-radius: 5px;
            background-color: rgba(0, 0, 0, 0.7);
            color: white;
            transition: 0.3s;
        }
        button:hover {
            background-color: rgba(0, 0, 0, 0.9);
        }
        iframe {
            flex-grow: 1;
            width: 100%;
            height: 100%;
            border: none;
        }
    </style>
</head>
<body>

    <div id="button-container">
        <button onclick="loadViz('advanced_spiral_arc_InfoVis/index.html')">infoVis Dataset</button>
        <button onclick="loadViz('advanced_spiral_with_an_arc_githubdataset/index.html')">Github Dataset</button>
    </div>

    <iframe id="vizFrame" src="advanced_spiral_arc_InfoVis/index.html"></iframe>

    <script>
        function loadViz(url) {
            document.getElementById("vizFrame").src = url;
        }
    </script>

</body>
</html>
